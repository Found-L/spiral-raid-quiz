# Included only inside the existing www.lysue.com HTTPS server block.
location = /spiral-raid-quiz {
    return 308 /spiral-raid-quiz/;
}

location ^~ /spiral-raid-quiz/api/ {
    client_max_body_size 20k;
    limit_req zone=spiral_quiz_requests burst=50 nodelay;
    limit_conn spiral_quiz_connections 30;
    proxy_pass http://127.0.0.1:8791/api/;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection close;
}

location ^~ /spiral-raid-quiz/ {
    alias /opt/spiral-raid-quiz/public/;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
}
